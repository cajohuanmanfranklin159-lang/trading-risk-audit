[project]
name = "trading-risk-audit"
version = "0.1.0"
description = "trading-risk-audit — position sizing, drawdown, expectancy and look-ahead-bias tasks for traders (single-turn, exact-match)."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.4.1"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trading_risk_audit"]
